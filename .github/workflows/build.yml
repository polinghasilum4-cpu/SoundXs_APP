name: Build SoundXs APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FLUTTER_CHANNEL: stable

jobs:
  build:
    name: Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      # Android Gradle scaffolding is generated by Flutter because this source
      # archive intentionally keeps only the app-specific Android files.
      - name: Generate missing Android Gradle wrapper and project files
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android --org com.soundxs --project-name soundxs_app /tmp/soundxs_scaffold
          mkdir -p android
          cp -rn /tmp/soundxs_scaffold/android/. android/
          # buang MainActivity hasil scaffold; yang dipakai adalah com.soundxs.app
          find android/app/src/main -name MainActivity.kt ! -path '*/com/soundxs/app/*' -delete
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml

      - name: Configure application ID and Android SDK levels
        shell: bash
        run: |
          set -euo pipefail
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i -E 's/com\.soundxs\.[A-Za-z0-9_]+/com.soundxs.app/g' "$f"
            sed -i -E 's/minSdk(Version)?([[:space:]]*=[[:space:]]*|[[:space:]]+)flutter\.minSdkVersion/minSdk\1\2 29/g' "$f"
            sed -i -E 's/targetSdk(Version)?([[:space:]]*=[[:space:]]*|[[:space:]]+)flutter\.targetSdkVersion/targetSdk\1\2 35/g' "$f"
          done
          grep -R -nE 'applicationId|namespace|minSdk|targetSdk|compileSdk' android/app/build.gradle* || true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundXs-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
